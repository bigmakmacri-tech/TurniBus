<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus 🚌</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 500px; margin: auto; }
        #auth-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 15px; border-radius: 8px; border: none; background: #007bff; color: white; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; }
        input { display: block; margin: 10px 0; padding: 12px; width: 100%; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #007bff;">TurniBus 🚌</h1>

    <div id="auth-section">
        <div id="login-form">
            <p>Se i tasti non rispondono, ricarica la pagina in <b>Incognito</b>.</p>
            <input type="email" id="email" placeholder="Email per login">
            <button type="button" onclick="loginWithEmail()">Invia Link Email</button>
            <button type="button" onclick="loginWithGoogle()" style="background: #4285F4;">Accedi con Google</button>
        </div>
        <div id="user-logged" style="display: none;">
            <p id="welcome-msg"></p>
            <button onclick="doLogout()" style="background: #dc3545;">Esci</button>
        </div>
    </div>

    <script>
        // Configurazione
        const S_URL = 'https://dvcoszwhurmseubyyxel.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Y29zendodXJtc2V1Ynl5eGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjEzMjUsImV4cCI6MjA4NjIzNzMyNX0.iBf-rl27gn3GhcK3BasTAQCUCydIc7edIDHCpY97j9Y';
        
        let client;

        function getClient() {
            if (!client) {
                if (typeof supabase === 'undefined') {
                    alert("ERRORE: La libreria Supabase è stata bloccata dal browser o dalla rete. Prova a cambiare connessione o browser.");
                    return null;
                }
                client = supabase.createClient(S_URL, S_KEY);
            }
            return client;
        }

        async function loginWithEmail() {
            const sb = getClient();
            if (!sb) return;
            const email = document.getElementById('email').value;
            if (!email) return alert("Inserisci l'email!");
            const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
            alert(error ? error.message : "Controlla la tua posta!");
        }

        async function loginWithGoogle() {
            const sb = getClient();
            if (!sb) return;
            const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
            if (error) alert(error.message);
        }

        async function doLogout() {
            const sb = getClient();
            await sb.auth.signOut();
            window.location.reload();
        }

        // Controllo automatico all'avvio
        window.addEventListener('DOMContentLoaded', () => {
            const sb = getClient();
            if (sb) {
                sb.auth.onAuthStateChanged((event, session) => {
                    if (session) {
                        document.getElementById('login-form').style.display = 'none';
                        document.getElementById('user-logged').style.display = 'block';
                        document.getElementById('welcome-msg').innerText = "Ciao, " + session.user.email;
                    }
                });
            }
        });
    </script>
</body>
</html>
