<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus 🚌</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; max-width: 500px; margin: auto; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 15px; border-radius: 8px; border: none; background: #007bff; color: white; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; }
        input { display: block; margin: 10px 0; padding: 12px; width: 100%; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1 style="color: #007bff;">TurniBus 🚌</h1>

    <div class="card">
        <div id="login-form">
            <h3>Accesso TurniBus</h3>
            <input type="email" id="email" placeholder="latua@email.com">
            <button onclick="loginEmail()">Invia Link Email</button>
            <button onclick="loginGoogle()" style="background: #4285F4;">Accedi con Google</button>
        </div>
        <div id="app-content" style="display: none;">
            <p>Benvenuto!</p>
            <button onclick="logout()" style="background: #dc3545;">Esci</button>
        </div>
    </div>

    <!-- CARICAMENTO DINAMICO: Questo evita il blocco della libreria -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net'

        const S_URL = 'https://dvcoszwhurmseubyyxel.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Y29zendodXJtc2V1Ynl5eGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjEzMjUsImV4cCI6MjA4NjIzNzMyNX0.iBf-rl27gn3GhcK3BasTAQCUCydIc7edIDHCpY97j9Y';
        
        const supabase = createClient(S_URL, S_KEY);

        window.loginEmail = async () => {
            const email = document.getElementById('email').value;
            const { error } = await supabase.auth.signInWithOtp({ 
                email, 
                options: { emailRedirectTo: window.location.href } 
            });
            alert(error ? error.message : "Controlla la mail!");
        };

        window.loginGoogle = async () => {
            const { error } = await supabase.auth.signInWithOAuth({ 
                provider: 'google', 
                options: { redirectTo: window.location.href } 
            });
            if (error) alert(error.message);
        };

        window.logout = async () => {
            await supabase.auth.signOut();
            window.location.reload();
        };

        supabase.auth.onAuthStateChanged((event, session) => {
            if (session) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
            }
        });
    </script>
</body>
</html>
