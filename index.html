<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus - Login</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        input { padding: 10px; margin: 10px; width: 80%; max-width: 300px; }
        button { padding: 10px 20px; background: #3ecf8e; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>TurniBus 🚌</h1>
    
    <div id="login-form">
        <input type="email" id="email" placeholder="Inserisci la tua email">
        <button onclick="login()">Ricevi link di accesso</button>
    </div>

    <div id="dashboard" style="display:none;">
        <p>✅ Sei loggato come: <strong id="user-email"></strong></p>
        <button onclick="logout()" style="background:#ff4b4b">Esci</button>
    </div>

    <script>
        const URL = 'https://dvcoszwhurmseubyyxel.supabase.co';
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Y29zendodXJtc2V1Ynl5eGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjEzMjUsImV4cCI6MjA4NjIzNzMyNX0.iBf-rl27gn3GhcK3BasTAQCUCydIc7edIDHCpY97j9Y';
        const sb = supabase.createClient(URL, KEY);

        async function login() {
            const email = document.getElementById('email').value;
            const { error } = await sb.auth.signInWithOtp({ 
                email,
                options: { emailRedirectTo: window.location.href } 
            });
            if (error) alert("Errore: " + error.message);
            else alert("Controlla la mail! Clicca sul link che ti è arrivato.");
        }

        async function logout() {
            await sb.auth.signOut();
            window.location.reload();
        }

        // Gestisce il login automatico al ritorno dalla mail
        sb.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('user-email').innerText = session.user.email;
            }
        });
    </script>
</body>
</html>
