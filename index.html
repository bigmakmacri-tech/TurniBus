<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus 🚌</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px;">
    <h1>TurniBus 🚌</h1>
    <p>Inserisci la mail per accedere:</p>
    
    <input type="email" id="email" placeholder="latua@email.it" style="padding:12px; width:250px;">
    <br><br>
    <button onclick="login()" id="btn" style="padding:10px 20px; cursor:pointer;">ACCEDI</button>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn');
            if(!email) return alert("Metti la mail!");

            btn.innerText = "Invio...";
            btn.disabled = true;

            try {
                // Parliamo con la nostra API su Vercel
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    body: JSON.stringify({ email: email })
                });
                
                if (res.ok) {
                    alert("✅ Se la mail è corretta, riceverai il link a breve!");
                } else {
                    alert("❌ Errore durante l'invio. Riprova.");
                }
            } catch (e) {
                alert("❌ Errore di connessione: " + e.message);
            } finally {
                btn.innerText = "ACCEDI";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
