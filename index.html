<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus 🚌</title>
    <!-- Libreria Supabase corretta -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f4f9; max-width: 500px; margin: auto; }
        .tab { display: none; }
        .active { display: block; }
        nav { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        button { padding: 12px; border-radius: 8px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        input { display: block; margin: 10px 0; padding: 12px; width: 100%; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.9em; }
        th { background: #007bff; color: white; }
        #auth-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logout-btn { background: #dc3545; font-size: 0.8em; margin-top: 10px; }
        .ripresa { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 10px; background: white; }
    </style>
</head>
<body>

    <h1 style="color: #007bff; text-align: center;">TurniBus 🚌</h1>

    <!-- SEZIONE LOGIN -->
    <div id="auth-section">
        <div id="login-form">
            <h3>Accedi a TurniBus</h3>
            <p style="font-size: 0.9em; color: #666;">Inserisci la tua email per il link magico.</p>
            <input type="email" id="email" placeholder="La tua email">
            <button onclick="login()" style="width: 100%;">Invia Link di Accesso</button>
            <hr>
            <button onclick="loginGoogle()" style="width: 100%; background: #4285F4;">Accedi con Google</button>
        </div>
        <div id="user-info" style="display: none; text-align: center;">
            <p>Ciao, <strong id="user-email"></strong></p>
            <button onclick="logout()" class="logout-btn">Esci</button>
        </div>
    </div>

    <!-- MENU APP -->
    <div id="app-content" style="display: none;">
        <nav>
            <button onclick="showTab('turni')">➕ Turni</button>
            <button onclick="showTab('monteore')">📊 Monte Ore</button>
            <button onclick="showTab('bustepaga')">💰 Buste Paga</button>
        </nav>

        <!-- TAB INSERIMENTO -->
        <div id="turni" class="tab active">
            <h3>Nuovo Turno</h3>
            <label>Data:</label>
            <input type="date" id="dataTurno">
            <div id="containerRiprese">
                <div class="ripresa">
                    <input type="text" class="linea" placeholder="Linea (es. 121, Fuori Servizio)">
                    <div style="display:flex; gap:10px;">
                        <input type="time" class="inizio">
                        <input type="time" class="fine">
                    </div>
                </div>
            </div>
            <button onclick="aggiungiRipresa()" style="background: #28a745; width: 100%; margin-bottom: 15px;">+ Aggiungi Ripresa</button>
            <button onclick="salva('Lavoro')" style="width: 100%; margin-bottom: 10px;">Salva Lavoro</button>
            <button onclick="salva('Ferie')" style="width: 100%; background: #17a2b8;">Segna Ferie (6.5h)</button>
        </div>

        <!-- TAB VISUALIZZAZIONE -->
        <div id="monteore" class="tab">
            <h3>Resoconto Ore</h3>
            <div id="lista-turni">Caricamento in corso...</div>
        </div>

        <!-- TAB BUSTE PAGA -->
        <div id="bustepaga" class="tab">
            <h3>Buste Paga</h3>
            <table>
                <tr><th>Mese</th><th>Netto (€)</th></tr>
                <script>
                    const mesi = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
                    mesi.forEach(m => document.write(`<tr><td>${m}</td><td><input type="number" step="0.01" style="margin:0; padding:5px;"></td></tr>`));
                </script>
            </table>
        </div>
    </div>

    <script>
        // Configurazione Supabase
        const SUPABASE_URL = 'https://dvcoszwhurmseubyyxel.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Y29zendodXJtc2V1Ynl5eGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjEzMjUsImV4cCI6MjA4NjIzNzMyNX0.iBf-rl27gn3GhcK3BasTAQCUCydIc7edIDHCpY97j9Y';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Gestione Sessione
        _supabase.auth.onAuthStateChanged((event, session) => {
            const isLogged = !!session;
            document.getElementById('login-form').style.display = isLogged ? 'none' : 'block';
            document.getElementById('user-info').style.display = isLogged ? 'block' : 'none';
            document.getElementById('app-content').style.display = isLogged ? 'block' : 'none';
            if (isLogged) document.getElementById('user-email').innerText = session.user.email;
        });

        async function login() {
            const email = document.getElementById('email').value;
            const { error } = await _supabase.auth.signInWithOtp({ email });
            alert(error ? error.message : "Controlla la tua email!");
        }

        async function loginGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({ provider: 'google' });
            if (error) alert(error.message);
        }

        async function logout() { await _supabase.auth.signOut(); }

        function showTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'monteore') caricaTurni();
        }

        function aggiungiRipresa() {
            const div = document.createElement('div');
            div.className = 'ripresa';
            div.innerHTML = `<input type="text" class="linea" placeholder="Linea"><div style="display:flex; gap:10px;"><input type="time" class="inizio"><input type="time" class="fine"></div>`;
            document.getElementById('containerRiprese').appendChild(div);
        }

        function calcolaMinuti(inizio, fine) {
            const [h1, m1] = inizio.split(':').map(Number);
            const [h2, m2] = fine.split(':').map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            return diff < 0 ? diff + 1440 : diff;
        }

        async function salva(tipo) {
            const dataVal = document.getElementById('dataTurno').value;
            if (!dataVal) return alert("Scegli una data!");

            const { data: { user } } = await _supabase.auth.getUser();
            let minutiTotali = 0;
            let riprese = [];

            if (tipo === 'Lavoro') {
                document.querySelectorAll('.ripresa').forEach(r => {
                    const i = r.querySelector('.inizio').value;
                    const f = r.querySelector('.fine').value;
                    if (i && f) {
                        minutiTotali += calcolaMinuti(i, f);
                        riprese.push({ linea: r.querySelector('.linea').value, inizio: i, fine: f });
                    }
                });
            } else {
                minutiTotali = 390; // 6.5 ore
            }

            const { error } = await _supabase.from('shifts').insert([{
                user_id: user.id,
                date: dataVal,
                type: tipo,
                total_hours: (minutiTotali / 60).toFixed(2),
                details: riprese
            }]);

            if (error) alert("Errore: " + error.message);
            else {
                alert("Salvato!");
                location.reload(); // Ricarica per pulire i campi
            }
        }

        async function caricaTurni() {
            const { data: { user } } = await _supabase.auth.getUser();
            const { data, error } = await _supabase.from('shifts').select('*').eq('user_id', user.id).order('date', { ascending: false });

            if (error) return;
            let html = '<table><tr><th>Data</th><th>Tipo</th><th>Ore</th></tr>';
            data.forEach(t => {
                html += `<tr><td>${t.date}</td><td>${t.type}</td><td>${t.total_hours}h</td></tr>`;
            });
            document.getElementById('lista-turni').innerHTML = html + '</table>';
        }
    </script>
</body>
</html>
