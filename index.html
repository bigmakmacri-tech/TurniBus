<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>TurniBus</title>
    <!-- Caricamento classico -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <h1>TurniBus 🚌</h1>
    <p id="status">Connessione in corso...</p>
    
    <div id="login-form">
        <input type="email" id="email" placeholder="latua@email.it">
        <button onclick="login()">INVIA LINK</button>
    </div>

    <script>
        // Verifichiamo subito se supabase esiste
        if (typeof supabase === 'undefined') {
            document.getElementById('status').innerText = "❌ Errore Caricamento Libreria";
        } else {
            const URL = 'https://dvcoszwhurmseubyyxel.supabase.co';
            const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2Y29zendodXJtc2V1Ynl5eGVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NjEzMjUsImV4cCI6MjA4NjIzNzMyNX0.iBf-rl27gn3GhcK3BasTAQCUCydIc7edIDHCpY97j9Y';
            const sb = supabase.createClient(URL, KEY);
            document.getElementById('status').innerText = "✅ Sistema Pronto";

            window.login = async () => {
                const email = document.getElementById('email').value;
                const { error } = await sb.auth.signInWithOtp({ 
                    email: email,
                    options: { emailRedirectTo: window.location.origin }
                });
                if (error) alert("Errore: " + error.message);
                else alert("Controlla la mail!");
            }
        }
    </script>
</body>
</html>
