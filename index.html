<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus 🚌</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px;">
    <h1>TurniBus 🚌</h1>
    <p>Inserisci la mail per accedere:</p>
    
    <input type="email" id="email" placeholder="latua@email.it" style="padding:10px; width:250px;">
    <button onclick="inviaMail()" id="btn" style="padding:10px; background:#3ecf8e; color:white; border:none; border-radius:5px; cursor:pointer;">
        ACCEDI ORA
    </button>

    <script>
        async function inviaMail() {
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn');
            
            if(!email) return alert("Metti la mail!");
            
            btn.innerText = "Invio in corso...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    body: JSON.stringify({ email: email })
                });
                
                if (res.ok) {
                    alert("✅ Mail inviata! Controlla la posta.");
                } else {
                    alert("❌ Errore del server. Riprova tra poco.");
                }
            } catch (e) {
                alert("❌ Errore di connessione: " + e.message);
            } finally {
                btn.innerText = "ACCEDI ORA";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
