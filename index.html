<!DOCTYPE html>
<html lang="it">
<head>

    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .tab { display: none; }
        .active { display: block; }
        nav { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        button { padding: 10px; border-radius: 5px; border: none; background: #007bff; color: white; }
        input { display: block; margin: 10px 0; padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1 style="color: #007bff;">TurniBus 🚌</h1>

    <nav>
        <button onclick="showTab('turni')">Turni</button>
        <button onclick="showTab('monteore')">Monte Ore</button>
        <button onclick="showTab('bustepaga')">Buste Paga</button>
    </nav>

    <!-- SCHERMATA TURNI -->
    <div id="turni" class="tab active">
        <h3>Inserimento Turno</h3>
        <input type="date" id="dataTurno">
        <div id="containerRiprese">
            <div class="ripresa" style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                <input type="text" placeholder="Linea">
                <input type="time" placeholder="Inizio">
                <input type="time" placeholder="Fine">
            </div>
        </div>
        <button onclick="aggiungiRipresa()" style="background: #28a745;">+ Aggiungi Ripresa</button>
        <hr>
        <button onclick="salva('Lavoro')" style="width: 100%; margin-bottom: 5px;">Salva Lavoro</button>
        <button onclick="salva('Ferie')" style="width: 100%; background: #17a2b8;">Segna Ferie (6.5h)</button>
