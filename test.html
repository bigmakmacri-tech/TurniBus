<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurniBus Pro 🚌</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .ripresa { background: #f9f9f9; border-left: 5px solid #28a745; padding: 15px; margin: 15px 0; border-radius: 8px; position: relative; text-align: left; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .flex { display: flex; gap: 10px; }
        .flex div { flex: 1; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-add { background: #007bff; color: white; margin-bottom: 20px; }
        .btn-save { background: #28a745; color: white; }
        .btn-del { background: #dc3545; color: white; width: auto; padding: 5px 10px; font-size: 12px; position: absolute; right: 10px; top: 10px; margin: 0; }
        #totale-badge { background: #343a40; color: white; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nuovo Turno Spezzato 🚌</h2>
    
    <label style="display:block; text-align:left;">Data del servizio:</label>
    <input type="date" id="data-servizio">

    <!-- Area dove appariranno le riprese -->
    <div id="contenitore-riprese"></div>

    <button type="button" class="btn-add" onclick="aggiungiRipresa()">➕ AGGIUNGI RIPRESA</button>

    <div id="totale-badge">Ore Lavorate: 0h 0m</div>

    <label style="display:block; text-align:left;">Note Generali:</label>
    <textarea id="note-turno" rows="2" placeholder="Note su ritardi, guasti..."></textarea>

    <button type="button" class="btn-save" onclick="inviaDati()" id="btn-invia">💾 SALVA NEL FOGLIO</button>
</div>

<script>
    // URL del tuo Google Script
    const URL_GOOGLE = "https://script.google.com";
    
    // Imposta la data di oggi
    document.getElementById('data-servizio').valueAsDate = new Date();

    // Funzione per aggiungere un blocco ripresa
    function aggiungiRipresa() {
        const contenitore = document.getElementById('contenitore-riprese');
        const nuovoBlocco = document.createElement('div');
        nuovoBlocco.className = 'ripresa';
        
        nuovoBlocco.innerHTML = `
            <button type="button" class="btn-del" onclick="rimuoviRipresa(this)">X</button>
            <div class="flex">
                <div><label>Linea</label><input type="text" class="linea" placeholder="es. 10"></div>
                <div><label>Vettura</label><input type="text" class="vettura" placeholder="es. 405"></div>
            </div>
            <div class="flex">
                <div><label>Inizio</label><input type="time" class="inizio" onchange="calcolaOre()"></div>
                <div><label>Fine</label><input type="time" class="fine" onchange="calcolaOre()"></div>
            </div>
        `;
        contenitore.appendChild(nuovoBlocco);
        calcolaOre();
    }

    function rimuoviRipresa(tasto) {
        tasto.parentElement.remove();
        calcolaOre();
    }

    function calcolaOre() {
        let minutiTotali = 0;
        const blocchi = document.querySelectorAll('.ripresa');
        
        blocchi.forEach(b => {
            const inTime = b.querySelector('.inizio').value;
            const outTime = b.querySelector('.fine').value;
            
            if(inTime && outTime) {
                const [hI, mI] = inTime.split(':').map(Number);
                const [hF, mF] = outTime.split(':').map(Number);
                let diff = (hF * 60 + mF) - (hI * 60 + mI);
                if (diff < 0) diff += 1440; // Gestione notte
                minutiTotali += diff;
            }
        });

        const ore = Math.floor(minutiTotali / 60);
        const min = minutiTotali % 60;
        document.getElementById('totale-badge').innerText = `Ore Lavorate: ${ore}h ${min}m`;
        return `${ore}:${min.toString().padStart(2, '0')}`;
    }

    async function inviaDati() {
        const blocchi = document.querySelectorAll('.ripresa');
        if(blocchi.length === 0) {
            alert("Aggiungi almeno una ripresa!");
            return;
        }

        const btn = document.getElementById('btn-invia');
        btn.disabled = true;
        btn.innerText = "Salvataggio...";

        let dettaglioLinee = "";
        let orari = [];

        blocchi.forEach((b, index) => {
            const l = b.querySelector('.linea').value || "?";
            const v = b.querySelector('.vettura').value || "?";
            const i = b.querySelector('.inizio').value || "00:00";
            const f = b.querySelector('.fine').value || "00:00";
            
            dettaglioLinee += `R${index+1}: L${l} V${v} (${i}-${f}) | `;
            orari.push(i, f);
        });

        const payload = {
            data: document.getElementById('data-servizio').value,
            turno: dettaglioLinee,
            inizio: orari.sort()[0], // Prende l'orario più basso
            fine: orari.sort()[orari.length - 1], // Prende l'orario più alto
            ore: calcolaOre(),
            note: document.getElementById('note-turno').value
        };

        try {
            await fetch(URL_GOOGLE, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert("✅ Turno salvato!");
            location.reload(); 
        } catch (e) {
            alert("Errore: " + e.message);
            btn.disabled = false;
            btn.innerText = "💾 SALVA NEL FOGLIO";
        }
    }

    // Crea la prima ripresa in automatico all'apertura
    window.onload = aggiungiRipresa;
</script>

</body>
</html>
